<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#080d18"/>
    <stop offset="100%" style="stop-color:#0d1e38"/>
  </linearGradient>
  <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#00c2a8"/>
    <stop offset="100%" style="stop-color:#0066ff"/>
  </linearGradient>
  <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0066ff"/>
    <stop offset="100%" style="stop-color:#00c2a8"/>
  </linearGradient>
  <linearGradient id="stomach" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#00c2a8;stop-opacity:0.9"/>
    <stop offset="100%" style="stop-color:#0044cc;stop-opacity:0.7"/>
  </linearGradient>
</defs>

<!-- Background -->
<rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

<!-- Outer orbit circle (like original) -->
<circle cx="512" cy="460" r="310" fill="none" stroke="url(#g1)" stroke-width="18" opacity="0.35"/>

<!-- Endoscope control handle -->
<rect x="545" y="95" width="90" height="145" rx="22" fill="url(#g1)" opacity="0.9"/>
<rect x="565" y="115" width="50" height="8" rx="4" fill="#ffffff50"/>
<rect x="565" y="132" width="50" height="8" rx="4" fill="#ffffff50"/>
<rect x="565" y="149" width="50" height="8" rx="4" fill="#ffffff50"/>
<!-- Control knob -->
<circle cx="590" cy="210" r="22" fill="#081428" stroke="url(#g1)" stroke-width="4"/>
<circle cx="590" cy="210" r="10" fill="url(#g1)" opacity="0.8"/>

<!-- Insertion tube curving from handle to stomach -->
<path d="M 590 240 C 590 300 620 340 600 390 C 580 440 520 460 490 510 C 460 560 450 600 440 640"
  fill="none" stroke="url(#g1)" stroke-width="22" stroke-linecap="round" opacity="0.85"/>

<!-- Umbilical cord -->
<path d="M 545 160 C 480 180 420 200 380 260 C 340 320 330 380 320 440"
  fill="none" stroke="url(#g2)" stroke-width="14" stroke-linecap="round" opacity="0.5"/>

<!-- Stomach shape -->
<path d="M 380 520 C 340 480 300 500 295 550 C 290 610 320 660 370 680 C 420 700 480 690 510 660 C 545 630 555 590 540 555 C 525 520 480 510 450 520 C 430 527 415 540 400 535 C 385 530 385 515 380 520 Z"
  fill="url(#stomach)" opacity="0.85"/>

<!-- Distal tip of scope inside stomach -->
<circle cx="440" cy="648" r="20" fill="none" stroke="url(#g1)" stroke-width="8"/>
<circle cx="440" cy="648" r="8" fill="url(#g1)" opacity="0.9"/>
<circle cx="432" cy="642" r="3" fill="#00c2a8"/>
<circle cx="450" cy="642" r="3" fill="#4da6ff"/>

<!-- Pixel/digital scatter (top left, like original) -->
<rect x="115" y="310" width="28" height="28" rx="5" fill="url(#g1)" opacity="0.8"/>
<rect x="155" y="290" width="22" height="22" rx="4" fill="url(#g1)" opacity="0.65"/>
<rect x="190" y="320" width="18" height="18" rx="3" fill="url(#g1)" opacity="0.5"/>
<rect x="130" y="355" width="14" height="14" rx="3" fill="url(#g1)" opacity="0.45"/>
<rect x="170" y="360" width="10" height="10" rx="2" fill="url(#g1)" opacity="0.35"/>
<rect x="205" y="350" width="8" height="8" rx="2" fill="url(#g1)" opacity="0.3"/>
<rect x="118" y="390" width="8" height="8" rx="2" fill="url(#g1)" opacity="0.25"/>
<rect x="145" y="395" width="6" height="6" rx="1" fill="url(#g1)" opacity="0.2"/>
<rect x="225" y="370" width="6" height="6" rx="1" fill="url(#g1)" opacity="0.2"/>
<!-- EN letters in pixel area -->
<text x="145" y="370" font-family="'Inter','Helvetica Neue',sans-serif"
  font-size="72" font-weight="800" fill="url(#g1)" opacity="0.9">EN</text>

<!-- Bottom text: ENDOSCOP IA -->
<text x="512" y="890" font-family="'Inter','Helvetica Neue',sans-serif"
  font-size="72" font-weight="700" fill="#dde4f0" text-anchor="middle" letter-spacing="4">ENDOSCOP</text>
<text x="512" y="960" font-family="'Inter','Helvetica Neue',sans-serif"
  font-size="72" font-weight="800" fill="url(#g1)" text-anchor="middle" letter-spacing="8">IA</text>
</svg>
